unbind r
bind r source-file ~/dotfiles/config/tmux/tmux.conf

set -g prefix C-s
set -g mouse on 
set -g base-index 1
set -g status-position bottom
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key % split-window -h
bind-key T command-prompt -I "#T" "select-pane -T '%%'"
set-window-option -g mode-keys vi

bind-key -T prefix C-s run-shell ~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh
bind-key -T prefix C-r run-shell ~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh
# List of plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tpm'
# Menu styling options
set -g @catppuccin_window_status_style "basic" # basic, rounded, slanted, custom, or none
set -g @catppuccin_flavor 'mocha' 

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.config/tmux/plugins/tpm/tpm'
run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'
